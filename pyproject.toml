[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "failmin"
version = "0.2.0"
description = "Delta debugging for AI and Agent failures"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "FailMin contributors"}]
keywords = ["ai", "agents", "debugging", "llm", "delta-debugging", "rag", "observability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2"]

[project.scripts]
failmin = "failmin.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.urls]
Homepage = "https://github.com/xxPcy/failmin"
Repository = "https://github.com/xxPcy/failmin"
Issues = "https://github.com/xxPcy/failmin/issues"